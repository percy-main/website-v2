services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: percy
      POSTGRES_PASSWORD: percy
      POSTGRES_DB: percy_main
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U percy -d percy_main"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
