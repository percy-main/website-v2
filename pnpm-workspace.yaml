packages:
  - "apps/*"
  - "apps/proto/*"
  - "packages/*"
  - "infra"
# Postinstall script policy. pnpm 11 requires an explicit decision per
# package whose install script would otherwise run. Mirrors prior pnpm 10
# behaviour where these were all ignored without issue: sharp ships
# prebuilt platform bindings via its `@img/sharp-*` optional deps,
# esbuild via `@esbuild/*`, and cpu-features / ssh2 / protobufjs are
# transitive dev-time only.
allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  sharp: false
  ssh2: false

# Security overrides — force transitive deps off known-vulnerable versions.
# The @ai-sdk entries are version-unification overrides instead:
# @ai-sdk/otel hard-pins its own `ai` dependency, which would otherwise
# split the graph into two `ai` copies with incompatible types.
overrides:
  ai@<7.0.18: ">=7.0.18"
  "@ai-sdk/provider-utils@<5.0.6": ">=5.0.6"
  "@ai-sdk/gateway@<4.0.14": ">=4.0.14"
  # Unification override, not security: @smithy/signature-v4 must resolve
  # to a single copy or the prerender SigV4a signer registration breaks
  # (check-ssr-sigv4a, #623). signature-v4a 3.5.5 needs >=5.6.9 while the
  # aws-sdk pins resolve 5.6.8; dedupe won't cross the split on its own.
  "@smithy/signature-v4@<5.6.9": ">=5.6.9"
  # CVE-2026-15074: @fastify/swagger-ui 6.1.0 still pins @fastify/static
  # ^9.x; no swagger-ui release depends on 10.x yet. Drop this once one
  # does (#653).
  "@fastify/static@<10.1.1": ">=10.1.1"
  axios@<1.18.0: ">=1.18.0"
  # CVE-2026-14257 (ReDoS) + CVE-2026-69152 (DoS via unbounded intermediate
  # arrays): scoped to the 5.x line only. brace-expansion 5 dropped the
  # default export (named `expand` only), so forcing it onto minimatch 5/9
  # breaks them at runtime. The runtime 2.x copy is eliminated by the
  # minimatch override below instead; remaining 1.x/2.x copies are dev-only
  # chains that never reach the API image (#653).
  "brace-expansion@>=5.0.0 <5.0.9": ">=5.0.9"
  esbuild@<0.28.1: ">=0.28.1"
  # CVE-2026-18446 (host confusion via backslash in URI authority), plus
  # CVE-2026-75899/-75931/-75975/-76172 (SSRF and host canonicalization):
  # keep the 3.x and 4.x lines on their respective fixed patches. A scoped
  # caret avoids hoisting 3.x consumers onto the incompatible 4.x line.
  "fast-uri@>=3.0.0 <3.1.6": "^3.1.6"
  "fast-uri@>=4.0.0 <4.1.3": "^4.1.3"
  fast-xml-parser@<5.7.0: ">=5.7.0"
  # CVE-2026-47219: fastify's ^9.6.0 range already admits the fix; the
  # floor guards against dedupe re-resolving the vulnerable patch (#653).
  find-my-way@<9.7.0: ">=9.7.0"
  form-data@<4.0.6: ">=4.0.6"
  # GHSA-52cp-r559-cp3m (merge-key quadratic CPU) + GHSA-5p4m-2wfm-xmqj
  # (!!omap quadratic CPU, fixed in 4.3.1): @redocly/openapi-core 1.x
  # hard-pins js-yaml (4.1.1, 4.2.0 at latest); only 2.x moves to js-yaml 5.
  # Caret, not >=: js-yaml 5.x is out now, and a bare floor would hoist past
  # the 4.x line openapi-core pins. Drop once openapi-typescript depends on
  # @redocly/openapi-core 2.x.
  "js-yaml@>=4.0.0 <4.3.1": "^4.3.1"
  # CVE-2026-14257 continued: glob@10 (runtime via google-gax -> rimraf)
  # pins minimatch ^9, which pins vulnerable brace-expansion ^2 with no
  # fixed 2.x release. minimatch 10 keeps the API surface glob@10 uses and
  # moves to brace-expansion 5 (#653).
  minimatch@9: ">=10.2.5"
  # CVE-2026-67213 (DoS via infinite loop in ID generation): scoped to 3.x
  # with a caret so the override cannot hoist past it; nanoid 4+ is
  # ESM-only and would break CJS dependents if forced.
  "nanoid@>=3.0.0 <3.3.17": "^3.3.17"
  # @react-email/ui hard-pins next, so the floor must be forced past the
  # CVE-2026-64641/-64642/-64645/-64649 and CVE-2026-75604 fixes.
  next@<16.3.3: ">=16.3.3"
  # CVE-2026-69153: 8.5.23 completes the sourceMappingURL fix that 8.5.10
  # (GHSA-6g55-p6wh-862q) only partially shipped; the vulnerable copy rides
  # in via @newrelic/rrweb-snapshot.
  postcss@<8.5.23: ">=8.5.23"
  # GHSA-rgj7-g3m4-5g8c: keep both direct and Next optional sharp installs
  # on the fixed release.
  sharp@<0.35.4: ">=0.35.4"
  ws@<8.21.0: ">=8.21.0"
  yaml@<2.8.3: ">=2.8.3"
