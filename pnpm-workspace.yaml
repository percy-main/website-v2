packages:
  - "apps/*"
  - "apps/proto/*"
  - "packages/*"
  - "infra"
# Postinstall script policy. pnpm 11 requires an explicit decision per
# package whose install script would otherwise run. Mirrors prior pnpm 10
# behaviour where these were all ignored without issue: sharp ships
# prebuilt platform bindings via its `@img/sharp-*` optional deps,
# esbuild via `@esbuild/*`, and cpu-features / ssh2 / protobufjs are
# transitive dev-time only.
allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  sharp: false
  ssh2: false

# Security overrides — force transitive deps off known-vulnerable versions.
# The @ai-sdk entries are version-unification overrides instead:
# @ai-sdk/otel hard-pins its own `ai` dependency, which would otherwise
# split the graph into two `ai` copies with incompatible types.
overrides:
  ai@<7.0.18: ">=7.0.18"
  "@ai-sdk/provider-utils@<5.0.6": ">=5.0.6"
  "@ai-sdk/gateway@<4.0.14": ">=4.0.14"
  axios@<1.16.0: ">=1.16.0"
  esbuild@<0.28.1: ">=0.28.1"
  fast-xml-parser@<5.7.0: ">=5.7.0"
  form-data@<4.0.6: ">=4.0.6"
  postcss@<8.5.10: ">=8.5.10"
  ws@<8.21.0: ">=8.21.0"
  yaml@<2.8.3: ">=2.8.3"
