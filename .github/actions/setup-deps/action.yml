name: Setup pnpm + Node + workspace dependencies
description: >
  Installs pnpm, Node 24 with the pnpm-store cache, and the workspace
  dependencies via `pnpm install --frozen-lockfile`. Used by every
  fan-out job in _lint-test-build.yml so each job is independent and
  doesn't depend on a tarred node_modules surviving an actions/cache
  round-trip (pnpm's symlink tree is fragile through tar/untar).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 11.1.2

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
