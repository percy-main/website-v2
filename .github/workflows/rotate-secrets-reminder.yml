name: Rotate secrets reminder

# Opens a quarterly issue listing all secrets/variables documented in
# SECURITY.md so the maintainer is nudged to rotate (or explicitly
# defer with a fresh date). Manual trigger also available for testing.
on:
  schedule:
    # 09:00 UTC on the 1st of Jan, Apr, Jul, Oct.
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open or update reminder issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Idempotency: if an open reminder already exists this quarter
          # (matching title prefix), do nothing. This catches the case of
          # the cron firing twice (very rare, but possible during GH-side
          # incidents) and manual workflow_dispatch retests.
          QUARTER="$(date -u +%Y)-Q$((($(date -u +%-m)-1)/3+1))"
          TITLE="Rotate API secrets — $QUARTER reminder"
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Reminder issue #$EXISTING already open — nothing to do."
            exit 0
          fi
          BODY=$(cat <<'EOF'
          ## Quarterly secret rotation reminder

          Per [SECURITY.md → Secret rotation](../blob/main/SECURITY.md#secret-rotation), external-service credentials are rotated **annually at minimum**. This issue is the calendar nudge — close it once you've either rotated or deferred with a written reason.

          ### Action checklist

          - [ ] `MAPS_API_KEY` — Google Cloud Console → regenerate Maps JS API key
          - [ ] `NEW_RELIC_API_KEY` — NR UI → User key → Rotate (30-day overlap)
          - [ ] `SLACK_WEBHOOK_URL` (production env) — Slack → Apps → Incoming Webhooks → revoke + recreate
          - [ ] `NEW_RELIC_BROWSER_LICENSE_KEY` (production env, intentionally public) — only if NR flagged it
          - [ ] Confirm the next deploy (`Deploy` workflow on main) succeeds end-to-end after each rotation, before closing
          - [ ] Update SECURITY.md if any procedure changed
          - [ ] If deferring rotation, edit this issue with the deferral reason and the date you'll revisit

          ### Background

          Rotation cadence and per-secret procedures live in [SECURITY.md](../blob/main/SECURITY.md#secret-rotation). This workflow ([rotate-secrets-reminder.yml](../blob/main/.github/workflows/rotate-secrets-reminder.yml)) opens this issue on the 1st of Jan/Apr/Jul/Oct.

          _Generated by `.github/workflows/rotate-secrets-reminder.yml`._
          EOF
          )
          # No label flag — the existing label set doesn't have a clean
          # "security" / "operational" tag. Add one and update this if
          # the labelling scheme changes.
          gh issue create --repo "$REPO" \
            --title "$TITLE" \
            --body "$BODY"
