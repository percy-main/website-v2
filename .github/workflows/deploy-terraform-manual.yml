name: Deploy Terraform (manual)

# Escape hatch for re-running terraform apply outside the auto chain in
# deploy.yml. Useful when the auto run skipped a layer because CI failed
# earlier, or when applying a state-only change that doesn't touch app
# code at all.
#
# Choose which layer(s) to apply via the `target` input.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to apply. Defaults to main."
        required: false
        default: "main"
      target:
        description: "Which layer to apply."
        required: true
        default: "both"
        type: choice
        options:
          - shared
          - production
          - both

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: "bash -euo pipefail {0}"

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.7"
  # NR provider — newrelic_cloud_aws_link_account in shared (#201).
  # Workflow-level so both shared + production jobs inherit.
  NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
  TF_VAR_newrelic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID }}

jobs:
  terraform-shared:
    if: ${{ inputs.target == 'shared' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    # Backstop above the plan 10m + apply 25m step budget so a genuine
    # hang trips the graceful step timeout first (keeping the job alive
    # for the in-job cleanup), not this job-level cancel.
    timeout-minutes: 45
    # Shared layer applies foundational infra (Route 53, IAM, S3
    # backend) — gate on the production environment so a manual run
    # against an arbitrary ref still requires reviewer approval.
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - name: Capture deployed SHA
        id: ref
        # workflow_dispatch sets github.sha to the workflow file's branch
        # SHA, NOT the checked-out inputs.ref. Capture the actual SHA so
        # the NR change marker references what we applied.
        run: |
          DEPLOYED_SHA=$(git rev-parse HEAD)
          echo "sha=${DEPLOYED_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deployed SHA: ${DEPLOYED_SHA}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/environments/shared
        run: terraform init

      - name: Verify remote backend is configured
        working-directory: infra/environments/shared
        run: |
          if grep -q '# backend "s3"' main.tf || grep -q '#   bucket' main.tf; then
            echo "ERROR: S3 backend is still commented out in shared/main.tf"
            echo "Uncomment the backend block before applying."
            exit 1
          fi

      - name: Terraform Plan
        id: plan
        timeout-minutes: 10
        working-directory: infra/environments/shared
        # See ADR 035 — apply-time plan recorded for audit.
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
          exit ${PIPESTATUS[0]}

      - name: Release stale state lock if plan didn't release its own
        if: always() && steps.plan.outcome != 'success'
        uses: ./.github/actions/tf-unlock
        with:
          environment: shared
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          # Manual plan/apply has no -lock-timeout, so it can fail
          # immediately on contention with a live run. Scope the unlock to
          # this runner's own lock so that failure cannot clobber the
          # other run's active lock.
          only-current-runner: "true"

      - name: Plan summary
        if: always()
        working-directory: infra/environments/shared
        run: |
          {
            echo "## Terraform plan (shared, manual, apply-time) — ${{ steps.plan.outcome }}"
            echo '```'
            tail -n 200 plan.txt 2>/dev/null || echo "(no plan.txt)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        id: apply
        timeout-minutes: 25
        working-directory: infra/environments/shared
        run: |
          terraform apply -auto-approve -no-color tfplan 2>&1 | tee apply.log
          exit ${PIPESTATUS[0]}

      - name: Release stale state lock if apply didn't release its own
        if: always() && steps.apply.outcome != 'success'
        uses: ./.github/actions/tf-unlock
        with:
          environment: shared
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          # Manual plan/apply has no -lock-timeout, so it can fail
          # immediately on contention with a live run. Scope the unlock to
          # this runner's own lock so that failure cannot clobber the
          # other run's active lock.
          only-current-runner: "true"

      - name: Apply summary
        if: always()
        working-directory: infra/environments/shared
        env:
          REF_INPUT: ${{ inputs.ref }}
          DEPLOYED_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          {
            echo "## Terraform apply (shared, manual) — ${{ steps.apply.outcome }}"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Ref input: \`${REF_INPUT}\`"
            echo "- SHA: \`${DEPLOYED_SHA:-${GITHUB_SHA}}\`"
            echo '```'
            tail -n 100 apply.log 2>/dev/null || echo "(no apply.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record TF apply in New Relic
        if: success()
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_INFRA_ENTITY_GUID: ${{ vars.NEW_RELIC_INFRA_ENTITY_GUID }}
          ACTOR: ${{ github.actor }}
          REF_INPUT: ${{ inputs.ref }}
          DEPLOYED_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          if [ -z "${NEW_RELIC_API_KEY:-}" ] || [ -z "${NEW_RELIC_INFRA_ENTITY_GUID:-}" ]; then
            echo "New Relic API key or infrastructure entity GUID not configured, skipping"
            exit 0
          fi
          TIMESTAMP=$(date -u +%s)000
          DESCRIPTION="Manual infrastructure apply (shared): actor=${ACTOR} ref=${REF_INPUT}"
          PAYLOAD=$(jq -n \
            --arg version "$DEPLOYED_SHA" \
            --arg entity "$NEW_RELIC_INFRA_ENTITY_GUID" \
            --arg desc "$DESCRIPTION" \
            --argjson ts "$TIMESTAMP" \
            '{query: ("mutation { changeTrackingCreateDeployment(deployment: { version: \"" + $version + "\", entityGuid: \"" + $entity + "\", description: " + ($desc | tojson) + ", commit: \"" + $version + "\", deploymentType: BASIC, timestamp: " + ($ts | tostring) + " }) { deploymentId } }")}')
          RESPONSE=$(curl -s --max-time 15 --connect-timeout 5 -w "\n%{http_code}" -X POST "https://api.eu.newrelic.com/graphql" \
            -H "Content-Type: application/json" \
            -H "API-Key: $NEW_RELIC_API_KEY" \
            -d "$PAYLOAD" || printf '\n000')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" -ge 400 ] || echo "$BODY" | grep -q '"errors"'; then
            echo "::warning::New Relic infrastructure deployment tracking failed (HTTP $HTTP_CODE): $BODY"
          else
            echo "Infrastructure (shared, manual) recorded in New Relic"
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-deploy-failure
        with:
          job: terraform-shared-manual
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  terraform-production:
    if: ${{ always() && (inputs.target == 'production' || inputs.target == 'both') && (needs.terraform-shared.result == 'success' || needs.terraform-shared.result == 'skipped') }}
    needs: terraform-shared
    runs-on: ubuntu-latest
    # See terraform-shared: backstop above the plan + apply step budget.
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - name: Capture deployed SHA
        id: ref
        # workflow_dispatch sets github.sha to the workflow file's branch
        # SHA, NOT the checked-out inputs.ref. Capture the actual SHA so
        # the NR change marker references what we applied.
        run: |
          DEPLOYED_SHA=$(git rev-parse HEAD)
          echo "sha=${DEPLOYED_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deployed SHA: ${DEPLOYED_SHA}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/environments/production
        run: terraform init

      - name: Terraform Plan
        id: plan
        timeout-minutes: 10
        working-directory: infra/environments/production
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
          exit ${PIPESTATUS[0]}

      - name: Release stale state lock if plan didn't release its own
        if: always() && steps.plan.outcome != 'success'
        uses: ./.github/actions/tf-unlock
        with:
          environment: production
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          # See the shared job: scope to this runner's own lock so a
          # contention failure cannot clobber another live run's lock.
          only-current-runner: "true"

      - name: Plan summary
        if: always()
        working-directory: infra/environments/production
        run: |
          {
            echo "## Terraform plan (production, manual, apply-time) — ${{ steps.plan.outcome }}"
            echo '```'
            tail -n 200 plan.txt 2>/dev/null || echo "(no plan.txt)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        id: apply
        timeout-minutes: 25
        working-directory: infra/environments/production
        run: |
          terraform apply -auto-approve -no-color tfplan 2>&1 | tee apply.log
          exit ${PIPESTATUS[0]}

      - name: Release stale state lock if apply didn't release its own
        if: always() && steps.apply.outcome != 'success'
        uses: ./.github/actions/tf-unlock
        with:
          environment: production
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          # See the shared job: scope to this runner's own lock so a
          # contention failure cannot clobber another live run's lock.
          only-current-runner: "true"

      - name: Apply summary
        if: always()
        working-directory: infra/environments/production
        env:
          REF_INPUT: ${{ inputs.ref }}
          DEPLOYED_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          {
            echo "## Terraform apply (production, manual) — ${{ steps.apply.outcome }}"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Ref input: \`${REF_INPUT}\`"
            echo "- SHA: \`${DEPLOYED_SHA:-${GITHUB_SHA}}\`"
            echo '```'
            tail -n 100 apply.log 2>/dev/null || echo "(no apply.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record TF apply in New Relic
        if: success()
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_INFRA_ENTITY_GUID: ${{ vars.NEW_RELIC_INFRA_ENTITY_GUID }}
          ACTOR: ${{ github.actor }}
          REF_INPUT: ${{ inputs.ref }}
          DEPLOYED_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          if [ -z "${NEW_RELIC_API_KEY:-}" ] || [ -z "${NEW_RELIC_INFRA_ENTITY_GUID:-}" ]; then
            echo "New Relic API key or infrastructure entity GUID not configured, skipping"
            exit 0
          fi
          TIMESTAMP=$(date -u +%s)000
          DESCRIPTION="Manual infrastructure apply (production): actor=${ACTOR} ref=${REF_INPUT}"
          PAYLOAD=$(jq -n \
            --arg version "$DEPLOYED_SHA" \
            --arg entity "$NEW_RELIC_INFRA_ENTITY_GUID" \
            --arg desc "$DESCRIPTION" \
            --argjson ts "$TIMESTAMP" \
            '{query: ("mutation { changeTrackingCreateDeployment(deployment: { version: \"" + $version + "\", entityGuid: \"" + $entity + "\", description: " + ($desc | tojson) + ", commit: \"" + $version + "\", deploymentType: BASIC, timestamp: " + ($ts | tostring) + " }) { deploymentId } }")}')
          RESPONSE=$(curl -s --max-time 15 --connect-timeout 5 -w "\n%{http_code}" -X POST "https://api.eu.newrelic.com/graphql" \
            -H "Content-Type: application/json" \
            -H "API-Key: $NEW_RELIC_API_KEY" \
            -d "$PAYLOAD" || printf '\n000')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" -ge 400 ] || echo "$BODY" | grep -q '"errors"'; then
            echo "::warning::New Relic infrastructure deployment tracking failed (HTTP $HTTP_CODE): $BODY"
          else
            echo "Infrastructure (production, manual) recorded in New Relic"
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-deploy-failure
        with:
          job: terraform-production-manual
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
