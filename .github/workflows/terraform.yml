name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: "bash -euo pipefail {0}"

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.7"
  # NR provider — newrelic_cloud_aws_link_account in shared (#201).
  NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
  TF_VAR_newrelic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    # Bound execution well under the 1h OIDC credential lifetime. The
    # 2026-06-15 stale lock came from a dependabot plan (shared) that hung
    # and ran to the 6h default limit; by then its creds had expired, so
    # the tf-unlock cleanup could not release the lock. A short cap frees
    # the lock fast and keeps the cleanup creds valid.
    timeout-minutes: 20
    # Backend-wide serialization. The workflow-level concurrency above
    # handles cancel-on-new-commit within a single PR; this job-level
    # group queues plans across PRs against the same backend so they
    # don't race on the DynamoDB state lock. Per-environment so shared
    # and production can plan in parallel.
    concurrency:
      group: terraform-plan-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      matrix:
        environment: [shared, production]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        # Fail the step fast on a hung plan rather than holding the lock
        # to the job limit; the job cap above is the backstop.
        timeout-minutes: 10
        working-directory: infra/environments/${{ matrix.environment }}
        # Use PIPESTATUS so a non-zero from terraform isn't masked by tee's 0.
        # (setup-terraform's wrapper appears to break the runner's default
        # `pipefail`, so we have to check explicitly.)
        # -lock-timeout: queue briefly behind a concurrent in-flight plan
        # rather than failing immediately on lock contention.
        run: |
          terraform plan -no-color -lock-timeout=2m -out=tfplan 2>&1 | tee plan.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Release stale state lock if plan didn't release its own
        # cancel-in-progress above SIGKILLs an in-flight terraform when
        # a new commit lands, leaving the DynamoDB lock orphaned. On
        # plan SUCCESS terraform releases the lock itself, so we only
        # need to clean up on the non-success paths — gating on
        # outcome != success also avoids clobbering an active lock
        # acquired by a concurrent run after this job started (the
        # TOCTOU concern that the previous timestamp guard tried to
        # address, less reliably).
        if: always() && steps.plan.outcome != 'success'
        uses: ./.github/actions/tf-unlock
        with:
          environment: ${{ matrix.environment }}
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}

      - name: Plan summary
        if: always()
        working-directory: infra/environments/${{ matrix.environment }}
        run: |
          {
            echo "## Terraform plan (${{ matrix.environment }}) — ${{ steps.plan.outcome }}"
            echo '```'
            tail -n 100 plan.txt 2>/dev/null || echo "(no plan.txt)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan to PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = `infra/environments/${{ matrix.environment }}/plan.txt`;
            let plan;
            try {
              plan = fs.readFileSync(path, 'utf8');
            } catch (err) {
              plan = `(no plan.txt produced — plan step ${'${{ steps.plan.outcome }}'})`;
            }
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            const outcome = '${{ steps.plan.outcome }}';
            const header = outcome === 'success'
              ? `### Terraform Plan: \`${{ matrix.environment }}\``
              : `### :x: Terraform Plan FAILED: \`${{ matrix.environment }}\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${header}\n\n<details>\n<summary>Show plan</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`
            });

      - name: Check plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1
