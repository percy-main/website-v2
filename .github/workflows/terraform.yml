name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/**"

# Baseline for all jobs. The credentialed plan job widens this for
# itself; the validate / static-check jobs run PR-controlled Terraform
# (a PR can point required_providers at an arbitrary plugin binary, and
# `terraform validate` executes provider plugins), so they must never
# see an OIDC token, AWS credentials, or secrets (#626 / ADR 057).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: "bash -euo pipefail {0}"

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.7"

jobs:
  static-checks:
    # Uncredentialed fast feedback: runs automatically on every infra
    # PR with no cloud credentials and no secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -diff -recursive infra/

      - name: Forbid OIDC trust for pull_request subjects
        # Guardrail for #626 / ADR 057: nothing in infra/ may reference
        # the GitHub OIDC `:pull_request` subject - that subject means
        # "any unreviewed PR run". Credentialed plans go through the
        # reviewer-gated terraform-plan environment subject instead.
        # Deliberately matched across ALL file types (tf, tf.json,
        # tftpl, ...) since trust policies can be authored in any of
        # them; the leading colon keeps prose mentions of pull
        # requests from tripping it.
        run: |
          if grep -rn ':pull_request' infra/; then
            echo "::error::infra/ references the OIDC ':pull_request' subject (matches above). Unreviewed PR runs must not be trusted with cloud credentials - use the reviewer-gated terraform-plan environment subject (ADR 057)."
            exit 1
          fi
          echo "OK: no ':pull_request' OIDC subjects in infra/"

  validate:
    # Uncredentialed `terraform validate` per environment. See the
    # workflow-level permissions comment: this job executes
    # PR-controlled provider plugins, so it deliberately has no
    # id-token, no AWS credentials, and no secrets in env.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Placeholder, NOT the real secret: the newrelic provider block in
      # shared marks api_key required, and validate checks provider
      # config schemas. Validate never configures providers or calls
      # any API, so any non-empty value satisfies the schema while
      # keeping this job secret-free.
      NEW_RELIC_API_KEY: "validate-only-placeholder"
    strategy:
      # Report both environments independently; a shared-only failure
      # cancelling production (or vice versa) hides signal.
      fail-fast: false
      matrix:
        environment: [shared, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (no backend)
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform validate

  plan:
    runs-on: ubuntu-latest
    # Reviewer gate (#626 / ADR 057): plan evaluates PR-controlled
    # configuration with credentials that can read state and secrets,
    # so every run waits for approval on the terraform-plan environment
    # and the plan role's OIDC trust only accepts the environment
    # subject. Read the infra diff before approving.
    environment: terraform-plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      # NR provider - newrelic_cloud_aws_link_account in shared (#201).
      # Job-scoped rather than workflow-level so the uncredentialed
      # jobs above never see the secret.
      NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
      TF_VAR_newrelic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
    # Bound execution well under the 1h OIDC credential lifetime. The
    # 2026-06-15 stale lock came from a dependabot plan (shared) that hung
    # and ran to the 6h default limit; by then its creds had expired, so
    # the tf-unlock cleanup could not release the lock. A short cap frees
    # the lock fast and keeps the cleanup creds valid.
    timeout-minutes: 20
    # Backend-wide serialization. The workflow-level concurrency above
    # handles cancel-on-new-commit within a single PR; this job-level
    # group queues plans across PRs against the same backend so they
    # don't race on the DynamoDB state lock. Per-environment so shared
    # and production can plan in parallel.
    concurrency:
      group: terraform-plan-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      matrix:
        environment: [shared, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        # Fail the step fast on a hung plan rather than holding the lock
        # to the job limit; the job cap above is the backstop.
        timeout-minutes: 10
        working-directory: infra/environments/${{ matrix.environment }}
        # Use PIPESTATUS so a non-zero from terraform isn't masked by tee's 0.
        # (setup-terraform's wrapper appears to break the runner's default
        # `pipefail`, so we have to check explicitly.)
        # -lock-timeout: queue briefly behind a concurrent in-flight plan
        # rather than failing immediately on lock contention.
        run: |
          terraform plan -no-color -lock-timeout=2m -out=tfplan 2>&1 | tee plan.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Release stale state lock if plan didn't release its own
        # cancel-in-progress above SIGKILLs an in-flight terraform when
        # a new commit lands, leaving the DynamoDB lock orphaned. On
        # plan SUCCESS terraform releases the lock itself, so we only
        # need to clean up on the non-success paths — gating on
        # outcome != success also avoids clobbering an active lock
        # acquired by a concurrent run after this job started (the
        # TOCTOU concern that the previous timestamp guard tried to
        # address, less reliably).
        if: always() && steps.plan.outcome != 'success'
        uses: ./.github/actions/tf-unlock
        with:
          environment: ${{ matrix.environment }}
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}

      - name: Plan summary
        if: always()
        working-directory: infra/environments/${{ matrix.environment }}
        run: |
          {
            echo "## Terraform plan (${{ matrix.environment }}) — ${{ steps.plan.outcome }}"
            echo '```'
            tail -n 100 plan.txt 2>/dev/null || echo "(no plan.txt)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan to PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = `infra/environments/${{ matrix.environment }}/plan.txt`;
            let plan;
            try {
              plan = fs.readFileSync(path, 'utf8');
            } catch (err) {
              plan = `(no plan.txt produced — plan step ${'${{ steps.plan.outcome }}'})`;
            }
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            const outcome = '${{ steps.plan.outcome }}';
            const header = outcome === 'success'
              ? `### Terraform Plan: \`${{ matrix.environment }}\``
              : `### :x: Terraform Plan FAILED: \`${{ matrix.environment }}\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${header}\n\n<details>\n<summary>Show plan</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`
            });

      - name: Check plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1
