name: Pull Request Labeler

# Applies path-based labels to PRs so reviewers/dashboards can filter by
# area (docs / packages / app / ci / infra / local-dev / dependencies).
# Mapping lives in .github/labeler.yml. See #338.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
