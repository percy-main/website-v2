name: Pull Request Labeler

# Applies path-based labels to PRs so reviewers/dashboards can filter by
# area (docs / packages / app / ci / infra / local-dev / dependencies).
# Mapping lives in .github/labeler.yml. See #338.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to v5.0.0. pull_request_target runs in the context of
      # the base repo with a write-scoped token, so pinning matters more
      # than for read-only jobs.
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
