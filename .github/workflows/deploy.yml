name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: "bash -euo pipefail {0}"

env:
  AWS_REGION: eu-west-2

jobs:
  # ── Stage 1: CI ──────────────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg16 = official Postgres 16 image with the
        # vector extension pre-built. Drop-in for postgres:16-alpine —
        # required since the scout_fact migration runs CREATE EXTENSION
        # vector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: percy
          POSTGRES_PASSWORD: percy
          POSTGRES_DB: percy_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U percy -d percy_main"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:up
        env:
          DATABASE_URL: postgres://percy:percy@localhost:5432/percy_main

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgres://percy:percy@localhost:5432/percy_main

      - name: Integration tests
        run: pnpm --filter api test:integration

  # ── Detect changed paths (runs parallel with Terraform) ──────────────
  changes:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'packages/db/**'
              - 'packages/email/**'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - '.github/workflows/deploy.yml'

  # ── Stage 2: Terraform ──────────────────────────────────────────────
  terraform-shared:
    needs: ci
    runs-on: ubuntu-latest
    env:
      TF_VERSION: "1.7"
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/environments/shared
        run: terraform init

      - name: Verify remote backend is configured
        working-directory: infra/environments/shared
        run: |
          if grep -q '# backend "s3"' main.tf || grep -q '#   bucket' main.tf; then
            echo "ERROR: S3 backend is still commented out in shared/main.tf"
            echo "Uncomment the backend block before applying."
            exit 1
          fi

      - name: Terraform Apply
        working-directory: infra/environments/shared
        run: terraform apply -auto-approve

  terraform-production:
    needs: terraform-shared
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VERSION: "1.7"
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/environments/production
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/environments/production
        run: terraform apply -auto-approve

  # ── Stage 3: Deploy API ─────────────────────────────────────────────
  deploy-api:
    needs: [terraform-production, changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04-arm
    environment: production
    env:
      ECR_REPOSITORY: percy-main-api
      ECS_CLUSTER: percy-main-production-cluster
      ECS_SERVICE: production-api
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build \
            --push \
            -t $IMAGE \
            -f apps/api/Dockerfile \
            .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Register new task definition
        id: task-def
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $ECS_SERVICE \
            --query 'taskDefinition' \
            --output json)

          NEW_TASK_DEF=$(echo $TASK_DEF | jq \
            --arg IMAGE "${{ steps.build.outputs.image }}" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task-definition-arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Run migrations
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].networkConfiguration' \
            --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition ${{ steps.task-def.outputs.task-definition-arn }} \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{
              "containerOverrides": [{
                "name": "api",
                "command": ["node", "apps/api/dist/migrate.js"]
              }]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition ${{ steps.task-def.outputs.task-definition-arn }} \
            --force-new-deployment

          echo "Waiting for deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.v2.percymain.org/health)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying..."
            sleep 5
          done
          echo "Smoke test failed"
          exit 1

      - name: Record deployment in New Relic
        if: success()
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ENTITY_GUID: ${{ vars.NEW_RELIC_ENTITY_GUID }}
        run: |
          if [ -z "$NEW_RELIC_API_KEY" ] || [ -z "$NEW_RELIC_ENTITY_GUID" ]; then
            echo "New Relic API key or entity GUID not configured, skipping"
            exit 0
          fi
          TIMESTAMP=$(date -u +%s)000
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.eu.newrelic.com/graphql" \
            -H "Content-Type: application/json" \
            -H "API-Key: $NEW_RELIC_API_KEY" \
            -d "{
              \"query\": \"mutation { changeTrackingCreateDeployment(deployment: { version: \\\"${{ github.sha }}\\\", entityGuid: \\\"$NEW_RELIC_ENTITY_GUID\\\", description: \\\"Deployed from GitHub Actions\\\", commit: \\\"${{ github.sha }}\\\", deploymentType: ROLLING, timestamp: $TIMESTAMP }) { deploymentId } }\"
            }")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" -ge 400 ] || echo "$BODY" | grep -q '"errors"'; then
            echo "::warning::New Relic deployment tracking failed (HTTP $HTTP_CODE): $BODY"
          else
            echo "Deployment recorded in New Relic"
          fi

  # ── Stage 4: Deploy Frontend ────────────────────────────────────────
  deploy-web:
    needs: [deploy-api, changes]
    # Run if web changed, even when deploy-api was skipped (no API changes)
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.web == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter web build
        env:
          VITE_API_URL: https://api.v2.percymain.org/api
          VITE_STRIPE_PUBLIC_KEY: ${{ vars.STRIPE_PUBLIC_KEY }}
          VITE_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          VITE_MAPS_MAP_ID: ${{ vars.MAPS_MAP_ID }}
          VITE_NEW_RELIC_LICENSE_KEY: ${{ vars.NEW_RELIC_BROWSER_LICENSE_KEY }}
          VITE_NEW_RELIC_APP_ID: ${{ vars.NEW_RELIC_BROWSER_APP_ID }}
          VITE_NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
          # Marketing — gtag block is omitted from index.html when these are unset
          # (see apps/web/vite.config.ts gtagHtmlPlugin). Set both repo variables
          # in GitHub → Settings → Variables before the next deploy:
          #   GOOGLE_ADS_CONVERSION_ID = "AW-18093051885"
          #   GA4_MEASUREMENT_ID       = "G-XXXXXXX" (when GA4 property is created)
          VITE_GOOGLE_ADS_CONVERSION_ID: ${{ vars.GOOGLE_ADS_CONVERSION_ID }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync apps/web/dist/ s3://${{ vars.FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"

          aws s3 cp apps/web/dist/index.html s3://${{ vars.FRONTEND_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

          find apps/web/dist -name "*.json" -exec sh -c \
            'aws s3 cp "$1" s3://${{ vars.FRONTEND_BUCKET }}/${1#apps/web/dist/} --cache-control "public, max-age=0, must-revalidate"' _ {} \;

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/*.json"
