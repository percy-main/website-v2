name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: "bash -euo pipefail {0}"

env:
  AWS_REGION: eu-west-2

jobs:
  # ── Stage 1: CI (lint + test + build, shared with PR CI) ────────────
  # `pnpm build` is a hard gate before any deploy work begins so a build
  # break that only manifests with prod env vars or a missing workspace
  # export fails fast instead of mid-deploy.
  ci:
    permissions:
      contents: read
      # Required by publish-unit-test-result-action inside the reusable
      # workflow.
      checks: write
      pull-requests: write
    uses: ./.github/workflows/_lint-test-build.yml

  # ── Detect changed paths (runs parallel with Terraform) ──────────────
  changes:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      matchday: ${{ steps.filter.outputs.matchday }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'packages/db/**'
              - 'packages/email/**'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - '.github/workflows/deploy.yml'
            matchday:
              - 'apps/matchday/**'
              - 'apps/api/**'
              - 'packages/shared/**'
              - '.github/workflows/deploy.yml'

  # ── Stage 2: Terraform ──────────────────────────────────────────────
  terraform-shared:
    needs: ci
    runs-on: ubuntu-latest
    # Backstop the per-step timeouts below (plan 10m + apply 25m): keep
    # it above their sum so a genuine hang trips the graceful step
    # timeout first (which keeps the job alive for the in-job cleanup),
    # not this job-level cancel. Still well under the 6h default that let
    # the 2026-06-15 shared lock squat and leak.
    timeout-minutes: 45
    # Shared layer applies Route 53, IAM, S3 backend, certificates -
    # gate on the production environment (same reviewer list as the
    # production layer) so a bad merge can't auto-apply foundational
    # infra without a human approval.
    environment: production
    env:
      TF_VERSION: "1.7"
      # NR provider - newrelic_cloud_aws_link_account in shared (#201).
      # Both values are REQUIRED for plan/apply against shared to
      # succeed: the var is required (no default) and the provider
      # validates auth at config time. Already populated in repo
      # secrets/vars from the wave-1 NR change-marker work.
      NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
      TF_VAR_newrelic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/environments/shared
        run: terraform init

      - name: Verify remote backend is configured
        working-directory: infra/environments/shared
        run: |
          if grep -q '# backend "s3"' main.tf || grep -q '#   bucket' main.tf; then
            echo "ERROR: S3 backend is still commented out in shared/main.tf"
            echo "Uncomment the backend block before applying."
            exit 1
          fi

      - name: Terraform Plan
        id: plan
        # Fail the step fast on a hung plan rather than holding the state
        # lock to the job limit; subsequent cleanup then runs with creds
        # still well within their 1h lifetime.
        timeout-minutes: 10
        working-directory: infra/environments/shared
        # Plan-then-apply in the gated job: PR reviewers approve from
        # the PR's plan comment; this records the apply-time plan in
        # the run summary so any drift between PR plan and apply is
        # auditable post hoc. See ADR 035.
        # -lock-timeout: queue briefly behind a concurrent in-flight
        # PR plan rather than failing instantly on lock contention.
        run: |
          terraform plan -no-color -lock-timeout=2m -out=tfplan 2>&1 | tee plan.txt
          exit ${PIPESTATUS[0]}

      - name: Release stale state lock if plan didn't release its own
        # Belt-and-braces against a runner being killed mid-plan.
        # cancel-in-progress is false on this workflow but a job can
        # still die from runner OOM / GH outage / 6h timeout / manual
        # cancellation. On success terraform releases the lock itself
        # - this only runs on the failure paths.
        if: always() && steps.plan.outcome != 'success'
        uses: ./.github/actions/tf-unlock
        with:
          environment: shared
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}

      - name: Plan summary
        if: always()
        working-directory: infra/environments/shared
        run: |
          {
            echo "## Terraform plan (shared, apply-time) - ${{ steps.plan.outcome }}"
            echo '```'
            tail -n 200 plan.txt 2>/dev/null || echo "(no plan.txt)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        id: apply
        timeout-minutes: 25
        working-directory: infra/environments/shared
        run: |
          terraform apply -auto-approve -lock-timeout=2m -no-color tfplan 2>&1 | tee apply.log
          exit ${PIPESTATUS[0]}

      - name: Release stale state lock if apply didn't release its own
        if: always() && steps.apply.outcome != 'success'
        uses: ./.github/actions/tf-unlock
        with:
          environment: shared
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}

      - name: Apply summary
        if: always()
        working-directory: infra/environments/shared
        run: |
          {
            echo "## Terraform apply (shared) - ${{ steps.apply.outcome }}"
            echo '```'
            tail -n 100 apply.log 2>/dev/null || echo "(no apply.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record TF apply in New Relic
        if: success()
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_INFRA_ENTITY_GUID: ${{ vars.NEW_RELIC_INFRA_ENTITY_GUID }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          if [ -z "${NEW_RELIC_API_KEY:-}" ] || [ -z "${NEW_RELIC_INFRA_ENTITY_GUID:-}" ]; then
            echo "New Relic API key or infrastructure entity GUID not configured, skipping"
            exit 0
          fi
          TIMESTAMP=$(date -u +%s)000
          DESCRIPTION="Infrastructure apply (shared): actor=${ACTOR} ref=${REF_NAME}"
          PAYLOAD=$(jq -n \
            --arg version "$DEPLOYED_SHA" \
            --arg entity "$NEW_RELIC_INFRA_ENTITY_GUID" \
            --arg desc "$DESCRIPTION" \
            --argjson ts "$TIMESTAMP" \
            '{query: ("mutation { changeTrackingCreateDeployment(deployment: { version: \"" + $version + "\", entityGuid: \"" + $entity + "\", description: " + ($desc | tojson) + ", commit: \"" + $version + "\", deploymentType: BASIC, timestamp: " + ($ts | tostring) + " }) { deploymentId } }")}')
          RESPONSE=$(curl -s --max-time 15 --connect-timeout 5 -w "\n%{http_code}" -X POST "https://api.eu.newrelic.com/graphql" \
            -H "Content-Type: application/json" \
            -H "API-Key: $NEW_RELIC_API_KEY" \
            -d "$PAYLOAD" || printf '\n000')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" -ge 400 ] || echo "$BODY" | grep -q '"errors"'; then
            echo "::warning::New Relic infrastructure deployment tracking failed (HTTP $HTTP_CODE): $BODY"
          else
            echo "Infrastructure (shared) recorded in New Relic"
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-deploy-failure
        with:
          job: terraform-shared
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  terraform-production:
    needs: terraform-shared
    runs-on: ubuntu-latest
    # See terraform-shared: backstop above the plan + apply step budget.
    timeout-minutes: 45
    environment: production
    env:
      TF_VERSION: "1.7"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/environments/production
        run: terraform init

      - name: Terraform Plan
        id: plan
        timeout-minutes: 10
        working-directory: infra/environments/production
        run: |
          terraform plan -no-color -lock-timeout=2m -out=tfplan 2>&1 | tee plan.txt
          exit ${PIPESTATUS[0]}

      - name: Release stale state lock if plan didn't release its own
        if: always() && steps.plan.outcome != 'success'
        uses: ./.github/actions/tf-unlock
        with:
          environment: production
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}

      - name: Plan summary
        if: always()
        working-directory: infra/environments/production
        run: |
          {
            echo "## Terraform plan (production, apply-time) - ${{ steps.plan.outcome }}"
            echo '```'
            tail -n 200 plan.txt 2>/dev/null || echo "(no plan.txt)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        id: apply
        timeout-minutes: 25
        working-directory: infra/environments/production
        run: |
          terraform apply -auto-approve -lock-timeout=2m -no-color tfplan 2>&1 | tee apply.log
          exit ${PIPESTATUS[0]}

      - name: Release stale state lock if apply didn't release its own
        if: always() && steps.apply.outcome != 'success'
        uses: ./.github/actions/tf-unlock
        with:
          environment: production
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}

      - name: Apply summary
        if: always()
        working-directory: infra/environments/production
        run: |
          {
            echo "## Terraform apply (production) - ${{ steps.apply.outcome }}"
            echo '```'
            tail -n 100 apply.log 2>/dev/null || echo "(no apply.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record TF apply in New Relic
        if: success()
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_INFRA_ENTITY_GUID: ${{ vars.NEW_RELIC_INFRA_ENTITY_GUID }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          if [ -z "${NEW_RELIC_API_KEY:-}" ] || [ -z "${NEW_RELIC_INFRA_ENTITY_GUID:-}" ]; then
            echo "New Relic API key or infrastructure entity GUID not configured, skipping"
            exit 0
          fi
          TIMESTAMP=$(date -u +%s)000
          DESCRIPTION="Infrastructure apply (production): actor=${ACTOR} ref=${REF_NAME}"
          PAYLOAD=$(jq -n \
            --arg version "$DEPLOYED_SHA" \
            --arg entity "$NEW_RELIC_INFRA_ENTITY_GUID" \
            --arg desc "$DESCRIPTION" \
            --argjson ts "$TIMESTAMP" \
            '{query: ("mutation { changeTrackingCreateDeployment(deployment: { version: \"" + $version + "\", entityGuid: \"" + $entity + "\", description: " + ($desc | tojson) + ", commit: \"" + $version + "\", deploymentType: BASIC, timestamp: " + ($ts | tostring) + " }) { deploymentId } }")}')
          RESPONSE=$(curl -s --max-time 15 --connect-timeout 5 -w "\n%{http_code}" -X POST "https://api.eu.newrelic.com/graphql" \
            -H "Content-Type: application/json" \
            -H "API-Key: $NEW_RELIC_API_KEY" \
            -d "$PAYLOAD" || printf '\n000')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" -ge 400 ] || echo "$BODY" | grep -q '"errors"'; then
            echo "::warning::New Relic infrastructure deployment tracking failed (HTTP $HTTP_CODE): $BODY"
          else
            echo "Infrastructure (production) recorded in New Relic"
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-deploy-failure
        with:
          job: terraform-production
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Stage 3: Deploy API ─────────────────────────────────────────────
  deploy-api:
    needs: [terraform-production, changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04-arm
    environment: production
    env:
      ECR_REPOSITORY: percy-main-api
      ECS_CLUSTER: percy-main-production-cluster
      ECS_SERVICE: production-api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build \
            --push \
            -t $IMAGE \
            -f apps/api/Dockerfile \
            .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Trivy scan
        # Pinned by commit SHA. The trivy-action repo was supply-chain
        # compromised on 2026-03-19 (CVE-2026-33634 / GHSA-69fq-xp46-6x23) -
        # the attacker force-pushed 76 of 77 version tags to credential-stealer
        # commits. Pinning by SHA prevents the same class of attack.
        # Suppressions live in `.trivyignore` at the repo root.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.image }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table

      - name: Generate SBOM (SPDX JSON)
        id: sbom
        # Snapshot of every package in the image at deploy time. Useful
        # for forensics when a future CVE drops ("did the version we
        # shipped on $SHA include vulnerable lib X?") without needing
        # to re-pull the image months later.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.build.outputs.image }}
          format: spdx-json
          artifact-name: api-sbom-${{ github.sha }}.spdx.json
          upload-artifact: true
          # Don't push results to GH Dependency Graph for the workspace -
          # we already track app deps via package.json; this would add
          # base-image system packages and inflate the dep list.
          dependency-snapshot: false

      - name: Register new task definition
        id: task-def
        env:
          IMAGE_URI: ${{ steps.build.outputs.image }}
          RELEASE_SHA: ${{ github.sha }}
          MIGRATION_TASK_DEF_FAMILY: production-api-migrate
        run: |
          # Helper: describe → patch image + RELEASE_SHA / NEW_RELIC_LABELS
          # env vars → register a new revision. NR APM and OTel can then
          # filter logs/traces by release. jq's group_by keeps the last
          # occurrence after our additions are appended, so an existing
          # RELEASE_SHA entry gets replaced rather than duplicated.
          patch_task_def() {
            local family="$1"
            local def
            def=$(aws ecs describe-task-definition \
              --task-definition "$family" \
              --query 'taskDefinition' \
              --output json)

            echo "$def" | jq \
              --arg IMAGE "$IMAGE_URI" \
              --arg SHA "$RELEASE_SHA" \
              '.containerDefinitions[0].image = $IMAGE
               | .containerDefinitions[0].environment = (
                   ((.containerDefinitions[0].environment // []) | map(select(.name != "RELEASE_SHA" and .name != "NEW_RELIC_LABELS"))) +
                   [{name: "RELEASE_SHA", value: $SHA},
                    {name: "NEW_RELIC_LABELS", value: ("release:" + $SHA)}]
                 )
               | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)'
          }

          API_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$(patch_task_def "$ECS_SERVICE")" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task-definition-arn=$API_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

          # Migration task def (#130 - principle of least privilege). Same
          # image, separate task def so DATABASE_URL → app_ddl is scoped
          # to migration runs only, not the long-running API container.
          MIGRATE_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$(patch_task_def "$MIGRATION_TASK_DEF_FAMILY")" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "migration-task-definition-arn=$MIGRATE_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Run migrations
        id: migrate
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].networkConfiguration' \
            --output json)

          # Migration uses its own task def (#130), which has the
          # `node apps/api/dist/migrate.js` command baked in. No
          # containerOverrides needed.
          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition ${{ steps.task-def.outputs.migration-task-definition-arn }} \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Migration failure diagnostics
        if: failure() && steps.migrate.outputs.task_arn != ''
        env:
          TASK_ARN: ${{ steps.migrate.outputs.task_arn }}
          EXIT_CODE: ${{ steps.migrate.outputs.exit_code }}
          TASK_DEF_ARN: ${{ steps.task-def.outputs.migration-task-definition-arn }}
        run: |
          # Surface task-stop reason + container reason + last 50 log
          # lines from the task's CloudWatch stream into the run summary,
          # so the cause (Fargate kill, OOM, SQL error) is visible
          # without dropping into the AWS console.
          set +e
          STOPPED_REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          CONTAINER_REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].reason' --output text)
          # Resolve the log group + stream prefix from the migration
          # task def (which has stream-prefix "migrate", distinct from
          # the API task's "api").
          LOG_GROUP=$(aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-group"' --output text)
          STREAM_PREFIX=$(aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-stream-prefix"' --output text)
          # awslogs convention: <prefix>/<containerName>/<task-id>
          TASK_ID=$(echo "$TASK_ARN" | awk -F/ '{print $NF}')
          STREAM="${STREAM_PREFIX}/api/${TASK_ID}"
          LOG_TAIL=$(aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$STREAM" \
            --limit 50 \
            --no-start-from-head \
            --query 'events[].message' --output text 2>&1)
          set -e
          {
            echo "## Migration failure"
            echo "- Exit code: \`${EXIT_CODE}\`"
            echo "- Task: \`${TASK_ARN}\`"
            echo "- Stopped reason: \`${STOPPED_REASON}\`"
            echo "- Container reason: \`${CONTAINER_REASON}\`"
            echo "- Log group: \`${LOG_GROUP}\`"
            echo "- Log stream: \`${STREAM}\`"
            echo ""
            echo '### Last 50 log lines'
            echo '```'
            echo "${LOG_TAIL}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition ${{ steps.task-def.outputs.task-definition-arn }} \
            --force-new-deployment

          echo "Waiting for deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      - name: Verify deployed task definition matches the one we registered
        # `aws ecs wait services-stable` only checks runningCount ==
        # desiredCount; it returns 0 even if ECS rolled back to the prior
        # revision after the new task crashed at boot (deployment circuit
        # breaker). This step asserts the PRIMARY deployment is actually
        # the task def we just registered. On mismatch, dumps the last 50
        # log lines from the API task's CloudWatch stream into the run
        # summary so the boot failure is visible without console-hopping.
        env:
          REGISTERED: ${{ steps.task-def.outputs.task-definition-arn }}
        run: |
          ACTIVE=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition' \
            --output text)
          if [ "$ACTIVE" = "$REGISTERED" ]; then
            echo "Active task def matches registered: $ACTIVE"
            exit 0
          fi
          echo "::error::ECS rolled back. Active task def: $ACTIVE; expected: $REGISTERED"
          set +e
          LOG_GROUP=$(aws ecs describe-task-definition --task-definition "$REGISTERED" \
            --query 'taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-group"' --output text)
          STREAM_PREFIX=$(aws ecs describe-task-definition --task-definition "$REGISTERED" \
            --query 'taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-stream-prefix"' --output text)
          # Boot-failed tasks were stopped by ECS; find the most recent
          # task that ran the registered (rolled-forward) revision and
          # tail its log stream. Filter by taskDefinitionArn so we don't
          # tail an unrelated older stopped task (e.g. a Fargate
          # platform replacement from hours ago) and mislead the
          # rollback triage.
          STOPPED_TASK=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --desired-status STOPPED --query 'taskArns[]' --output text)
          MATCHED=""
          if [ -n "$STOPPED_TASK" ]; then
            MATCHED=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks $STOPPED_TASK \
              --query "sort_by(tasks[?taskDefinitionArn=='$REGISTERED'], &stoppedAt)[-1].taskArn" \
              --output text)
          fi
          LOG_TAIL="(no stopped task matching the rolled-forward revision found)"
          if [ -n "$MATCHED" ] && [ "$MATCHED" != "None" ]; then
            TASK_ID=$(echo "$MATCHED" | awk -F/ '{print $NF}')
            STREAM="${STREAM_PREFIX}/api/${TASK_ID}"
            LOG_TAIL=$(aws logs get-log-events \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name "$STREAM" \
              --limit 50 --no-start-from-head \
              --query 'events[].message' --output text 2>&1)
          fi
          set -e
          {
            echo "## Deploy rolled back by ECS"
            echo "- Registered (rolled forward to): \`${REGISTERED}\`"
            echo "- Active (rolled back to): \`${ACTIVE}\`"
            echo "- Log group: \`${LOG_GROUP}\`"
            echo "- Stopped task tailed: \`${MATCHED:-none}\`"
            echo ""
            echo '### Last 50 log lines from rolled-forward task'
            echo '```'
            echo "${LOG_TAIL}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Smoke test
        id: smoke
        run: |
          # /health/ready returns 200 with database=connected when ready,
          # 503 with database=disconnected on DB outage (#193). curl
          # -fsSL fails non-zero on the 5xx, so a single status check is
          # sufficient - no body-grep needed.
          for i in $(seq 1 10); do
            if curl -fsSL --max-time 10 https://api.v2.percymain.org/health/ready -o /tmp/health.json; then
              echo "Smoke test passed: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "Attempt $i failed; retrying..."
            sleep 5
          done
          echo "Smoke test failed"
          exit 1

      - name: Record deployment in New Relic
        id: nr-deploy
        if: success()
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ENTITY_GUID: ${{ vars.NEW_RELIC_ENTITY_GUID }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          if [ -z "${NEW_RELIC_API_KEY:-}" ] || [ -z "${NEW_RELIC_ENTITY_GUID:-}" ]; then
            echo "New Relic API key or entity GUID not configured, skipping"
            exit 0
          fi
          TIMESTAMP=$(date -u +%s)000
          PAYLOAD=$(jq -n \
            --arg version "$DEPLOYED_SHA" \
            --arg entity "$NEW_RELIC_ENTITY_GUID" \
            --argjson ts "$TIMESTAMP" \
            '{query: ("mutation { changeTrackingCreateDeployment(deployment: { version: \"" + $version + "\", entityGuid: \"" + $entity + "\", description: \"Deployed from GitHub Actions\", commit: \"" + $version + "\", deploymentType: ROLLING, timestamp: " + ($ts | tostring) + " }) { deploymentId } }")}')
          RESPONSE=$(curl -s --max-time 15 --connect-timeout 5 -w "\n%{http_code}" -X POST "https://api.eu.newrelic.com/graphql" \
            -H "Content-Type: application/json" \
            -H "API-Key: $NEW_RELIC_API_KEY" \
            -d "$PAYLOAD" || printf '\n000')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" -ge 400 ] || echo "$BODY" | grep -q '"errors"'; then
            echo "::warning::New Relic deployment tracking failed (HTTP $HTTP_CODE): $BODY"
          else
            DEPLOY_ID=$(echo "$BODY" | jq -r '.data.changeTrackingCreateDeployment.deploymentId // empty')
            echo "deployment_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
            echo "Deployment recorded in New Relic: ${DEPLOY_ID}"
          fi

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Deploy API - ${{ job.status }}"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Image: \`${{ steps.build.outputs.image || 'n/a' }}\`"
            echo "- Task def: \`${{ steps.task-def.outputs.task-definition-arn || 'n/a' }}\`"
            echo "- Smoke: \`${{ steps.smoke.outcome || 'skipped' }}\`"
            echo "- NR deploy: \`${{ steps.nr-deploy.outputs.deployment_id || 'skipped' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-deploy-failure
        with:
          job: deploy-api
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Stage 4: Deploy Frontend ────────────────────────────────────────
  deploy-web:
    needs: [terraform-production, deploy-api, changes]
    # Run if web changed, even when deploy-api was skipped (no API changes).
    # terraform-production MUST have succeeded - `always()` would
    # otherwise let a failed TF apply trigger a deploy against potentially-
    # stale infra. deploy-api may be skipped (no API changes).
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.web == 'true' &&
      needs.terraform-production.result == 'success' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter web build
        env:
          VITE_API_URL: https://api.v2.percymain.org/api
          VITE_STRIPE_PUBLIC_KEY: ${{ vars.STRIPE_PUBLIC_KEY }}
          VITE_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          VITE_MAPS_MAP_ID: ${{ vars.MAPS_MAP_ID }}
          VITE_NEW_RELIC_LICENSE_KEY: ${{ vars.NEW_RELIC_BROWSER_LICENSE_KEY }}
          VITE_NEW_RELIC_APP_ID: ${{ vars.NEW_RELIC_BROWSER_APP_ID }}
          VITE_NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID }}
          # Marketing - gtag block is omitted from index.html when these are unset
          # (see apps/web/vite.config.ts gtagHtmlPlugin). Set both repo variables
          # in GitHub → Settings → Variables before the next deploy:
          #   GOOGLE_ADS_CONVERSION_ID = "AW-18093051885"
          #   GA4_MEASUREMENT_ID       = "G-XXXXXXX" (when GA4 property is created)
          VITE_GOOGLE_ADS_CONVERSION_ID: ${{ vars.GOOGLE_ADS_CONVERSION_ID }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync apps/web/dist/ s3://${{ vars.FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"

          aws s3 cp apps/web/dist/index.html s3://${{ vars.FRONTEND_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

          find apps/web/dist -name "*.json" -exec sh -c \
            'aws s3 cp "$1" s3://${{ vars.FRONTEND_BUCKET }}/${1#apps/web/dist/} --cache-control "public, max-age=0, must-revalidate"' _ {} \;

      - name: Invalidate CloudFront cache
        id: invalidate
        # `/` and `/index.html` cache as separate keys at the edge - must
        # invalidate both so the post-deploy smoke against `/` doesn't
        # validate a stale cached root document.
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/" "/index.html" "/*.json" \
            --query 'Invalidation.Id' --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"

      - name: Record web deployment in New Relic
        id: nr-deploy-web
        if: success()
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_BROWSER_ENTITY_GUID: ${{ vars.NEW_RELIC_BROWSER_ENTITY_GUID }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          if [ -z "${NEW_RELIC_API_KEY:-}" ] || [ -z "${NEW_RELIC_BROWSER_ENTITY_GUID:-}" ]; then
            echo "New Relic API key or Browser entity GUID not configured, skipping"
            exit 0
          fi
          TIMESTAMP=$(date -u +%s)000
          DESCRIPTION="Web deploy: actor=${ACTOR} ref=${REF_NAME}"
          PAYLOAD=$(jq -n \
            --arg version "$DEPLOYED_SHA" \
            --arg entity "$NEW_RELIC_BROWSER_ENTITY_GUID" \
            --arg desc "$DESCRIPTION" \
            --argjson ts "$TIMESTAMP" \
            '{query: ("mutation { changeTrackingCreateDeployment(deployment: { version: \"" + $version + "\", entityGuid: \"" + $entity + "\", description: " + ($desc | tojson) + ", commit: \"" + $version + "\", deploymentType: BASIC, timestamp: " + ($ts | tostring) + " }) { deploymentId } }")}')
          RESPONSE=$(curl -s --max-time 15 --connect-timeout 5 -w "\n%{http_code}" -X POST "https://api.eu.newrelic.com/graphql" \
            -H "Content-Type: application/json" \
            -H "API-Key: $NEW_RELIC_API_KEY" \
            -d "$PAYLOAD" || printf '\n000')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" -ge 400 ] || echo "$BODY" | grep -q '"errors"'; then
            echo "::warning::New Relic web deployment tracking failed (HTTP $HTTP_CODE): $BODY"
          else
            DEPLOY_ID=$(echo "$BODY" | jq -r '.data.changeTrackingCreateDeployment.deploymentId // empty')
            echo "deployment_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
            echo "Web deployment recorded in New Relic: ${DEPLOY_ID}"
          fi

      - name: Smoke test web
        id: smoke-web
        env:
          URL: https://percymain.org/
        run: |
          curl -fsSL --max-time 15 "$URL" -o /tmp/index.html
          # Marker that the SPA shell rendered correctly.
          grep -q '<div id="root"' /tmp/index.html
          # Verify at least one referenced JS chunk is reachable. `|| true`
          # keeps errexit happy when grep finds no match (an empty $ASSET
          # is handled by the `if -n` branch below).
          ASSET=$(grep -oE 'src="(/[^"]+\.js)"' /tmp/index.html | head -1 | sed 's/src="//;s/"//' || true)
          if [ -n "$ASSET" ]; then
            curl -fsSL --max-time 15 "https://percymain.org${ASSET}" -o /dev/null
          else
            echo "::warning::No JS chunk found in index.html - skipping asset reachability check"
          fi

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Deploy Web - ${{ job.status }}"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Bucket: \`${{ vars.FRONTEND_BUCKET }}\`"
            echo "- CF distribution: \`${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}\`"
            echo "- Invalidation: \`${{ steps.invalidate.outputs.invalidation_id || 'skipped' }}\`"
            echo "- Smoke: \`${{ steps.smoke-web.outcome || 'skipped' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-deploy-failure
        with:
          job: deploy-web
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Stage 4 (parallel): Deploy matchday PWA ──────────────────────────
  # Modelled on deploy-web; the matchday app lives on its own S3 bucket +
  # CloudFront distribution. Runs in parallel with deploy-web - no shared
  # state. Skipped when nothing under apps/matchday/** changed.
  deploy-matchday:
    needs: [terraform-production, deploy-api, changes]
    # deploy-api is allowed to be skipped (API didn't change) but
    # terraform-production MUST have succeeded - the matchday bucket
    # and CloudFront distribution are created there. Without an explicit
    # `terraform-production == 'success'` guard the `always()` would let
    # a failed TF apply still run the deploy and fail late at the S3
    # sync step.
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.matchday == 'true' &&
      needs.terraform-production.result == 'success' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify required GitHub repo variables are set
        # First-run protection. The matchday bucket + distribution are
        # provisioned by Terraform; their IDs land in `terraform output`
        # and an operator copies them to repo Variables (`Settings →
        # Variables`). Without them the S3 sync command below expands
        # to `s3://` and fails opaquely halfway through the job - fail
        # fast here with a pointer at the wiring instead.
        env:
          BUCKET: ${{ vars.MATCHDAY_FRONTEND_BUCKET }}
          DIST: ${{ vars.MATCHDAY_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          missing=()
          [ -z "${BUCKET:-}" ] && missing+=("MATCHDAY_FRONTEND_BUCKET")
          [ -z "${DIST:-}" ] && missing+=("MATCHDAY_CLOUDFRONT_DISTRIBUTION_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing GitHub repo variables: ${missing[*]}"
            echo "Run 'terraform output' from infra/environments/production and copy:"
            echo "  matchday_frontend_bucket_name        → MATCHDAY_FRONTEND_BUCKET"
            echo "  matchday_cloudfront_distribution_id  → MATCHDAY_CLOUDFRONT_DISTRIBUTION_ID"
            echo "into Settings → Secrets and variables → Actions → Variables, then re-run."
            exit 1
          fi

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build matchday
        run: pnpm --filter matchday build
        env:
          VITE_API_URL: https://api.v2.percymain.org/api
          VITE_MAIN_SITE_URL: https://percymain.org
          VITE_STRIPE_PUBLIC_KEY: ${{ vars.STRIPE_PUBLIC_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync apps/matchday/dist/ s3://${{ vars.MATCHDAY_FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json" \
            --exclude "*.webmanifest" \
            --exclude "sw.js" \
            --exclude "registerSW.js" \
            --exclude "workbox-*.js"

          aws s3 cp apps/matchday/dist/index.html s3://${{ vars.MATCHDAY_FRONTEND_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

          # Service worker + manifest must never be cached at the edge -
          # otherwise a new deploy ships with a stale registration that
          # holds the old assets in clients' caches indefinitely.
          if [ -f apps/matchday/dist/sw.js ]; then
            aws s3 cp apps/matchday/dist/sw.js s3://${{ vars.MATCHDAY_FRONTEND_BUCKET }}/sw.js \
              --cache-control "public, max-age=0, must-revalidate"
          fi
          if [ -f apps/matchday/dist/registerSW.js ]; then
            aws s3 cp apps/matchday/dist/registerSW.js s3://${{ vars.MATCHDAY_FRONTEND_BUCKET }}/registerSW.js \
              --cache-control "public, max-age=0, must-revalidate"
          fi

          find apps/matchday/dist -maxdepth 2 \( -name "*.json" -o -name "*.webmanifest" \) -exec sh -c \
            'aws s3 cp "$1" s3://${{ vars.MATCHDAY_FRONTEND_BUCKET }}/${1#apps/matchday/dist/} --cache-control "public, max-age=0, must-revalidate"' _ {} \;

      - name: Invalidate matchday CloudFront cache
        id: invalidate-matchday
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.MATCHDAY_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/" "/index.html" "/*.json" "/*.webmanifest" "/sw.js" "/registerSW.js" \
            --query 'Invalidation.Id' --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ vars.MATCHDAY_CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "${{ steps.invalidate-matchday.outputs.invalidation_id }}"

      - name: Smoke test matchday
        id: smoke-matchday
        env:
          URL: https://matchday.percymain.org/
        run: |
          curl -fsSL --max-time 15 "$URL" -o /tmp/matchday.html
          grep -q '<div id="root"' /tmp/matchday.html

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Deploy Matchday - ${{ job.status }}"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Bucket: \`${{ vars.MATCHDAY_FRONTEND_BUCKET }}\`"
            echo "- CF distribution: \`${{ vars.MATCHDAY_CLOUDFRONT_DISTRIBUTION_ID }}\`"
            echo "- Invalidation: \`${{ steps.invalidate-matchday.outputs.invalidation_id || 'skipped' }}\`"
            echo "- Smoke: \`${{ steps.smoke-matchday.outcome || 'skipped' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-deploy-failure
        with:
          job: deploy-matchday
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
