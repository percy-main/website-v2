name: Deploy Web (manual)

# Escape hatch for when the auto-deploy chain in deploy.yml didn't fire
# for the frontend but the desired commit on main is known-good — e.g.
# CI failed for an API-only commit, the API fix landed, but the next
# successful Deploy run sees no web changes and skips deploy-web.
#
# Mirrors the deploy-web job in deploy.yml verbatim, minus the CI gate
# and the changes-filter. Always builds and uploads.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to deploy. Defaults to main."
        required: false
        default: "main"

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: "bash -euo pipefail {0}"

env:
  AWS_REGION: eu-west-2

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Capture deployed SHA
        id: ref
        # workflow_dispatch sets github.sha to the workflow file's branch
        # SHA, NOT the checked-out inputs.ref. Capture the actual SHA
        # so the summary references what we deployed.
        run: |
          DEPLOYED_SHA=$(git rev-parse HEAD)
          echo "sha=${DEPLOYED_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deployed SHA: ${DEPLOYED_SHA}"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bake nav snapshot
        # Mirrors deploy.yml: live nav as initialData; fail-soft.
        run: node apps/web/scripts/fetch-nav-snapshot.mjs

      - name: Build frontend
        # build:ssr = the prerenderer Lambda bundle, built with the same
        # env so markup and hashed asset references match the client
        # build exactly (check:ssr-assets asserts it).
        run: |
          pnpm --filter web build
          pnpm --filter web build:ssr
          pnpm --filter web check:ssr-assets
        env:
          VITE_API_URL: https://api.v2.percymain.org/api
          VITE_STRIPE_PUBLIC_KEY: ${{ vars.STRIPE_PUBLIC_KEY }}
          VITE_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          VITE_MAPS_MAP_ID: ${{ vars.MAPS_MAP_ID }}
          VITE_GOOGLE_ADS_CONVERSION_ID: ${{ vars.GOOGLE_ADS_CONVERSION_ID }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        # Two-phase deploy (mirrors deploy.yml): ADD/UPDATE only here; old
        # hashed assets survive until every prerendered snapshot has been
        # re-rendered against the new bundle. "Remove stale assets" below
        # does the --delete pass.
        run: |
          aws s3 sync apps/web/dist/ s3://${{ vars.FRONTEND_BUCKET }} \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json" \
            --exclude "robots.txt"

          aws s3 cp apps/web/dist/index.html s3://${{ vars.FRONTEND_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

          aws s3 cp apps/web/dist/robots.txt s3://${{ vars.FRONTEND_BUCKET }}/robots.txt \
            --cache-control "public, max-age=0, must-revalidate"

          find apps/web/dist -name "*.json" -exec sh -c \
            'aws s3 cp "$1" s3://${{ vars.FRONTEND_BUCKET }}/${1#apps/web/dist/} --cache-control "public, max-age=0, must-revalidate"' _ {} \;

      - name: Deploy prerenderer Lambda
        run: |
          cp apps/web/dist/index.html apps/web/dist-server/template.html
          (cd apps/web/dist-server && zip -qr ../../../prerenderer.zip .)
          aws lambda update-function-code \
            --function-name percy-main-production-prerenderer \
            --zip-file fileb://prerenderer.zip >/dev/null
          aws lambda wait function-updated \
            --function-name percy-main-production-prerenderer

      - name: Invalidate CloudFront cache
        id: invalidate
        # `/` and `/index.html` cache as separate keys at the edge — must
        # invalidate both so the post-deploy smoke against `/` doesn't
        # validate a stale cached root document.
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/" "/index.html" "/*.json" \
            --query 'Invalidation.Id' --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"

      - name: Rerender prerendered pages
        # Synchronous: stale-asset cleanup below must not run until every
        # snapshot references the new bundle. Gated like deploy.yml.
        if: vars.PRERENDER_ENABLED == 'true'
        run: |
          aws lambda invoke \
            --function-name percy-main-production-prerenderer \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 960 \
            --payload '{"action":"render-all"}' \
            /tmp/render-all.json
          cat /tmp/render-all.json
          if grep -q '"errorMessage"' /tmp/render-all.json; then
            echo "::error::prerenderer render-all failed"
            exit 1
          fi

      - name: Remove stale assets
        # The excludes protect the prerenderer's bucket-side objects
        # (snapshots, sitemap, state.json) from --delete.
        run: |
          aws s3 sync apps/web/dist/ s3://${{ vars.FRONTEND_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json" \
            --exclude "robots.txt" \
            --exclude "_prerender/*" \
            --exclude "sitemap.xml"

      - name: Smoke test web
        id: smoke-web
        env:
          URL: https://percymain.org/
        run: |
          curl -fsSL --max-time 15 "$URL" -o /tmp/index.html
          grep -q '<div id="root"' /tmp/index.html
          # `|| true` keeps errexit happy when grep finds no match.
          ASSET=$(grep -oE 'src="(/[^"]+\.js)"' /tmp/index.html | head -1 | sed 's/src="//;s/"//' || true)
          if [ -n "$ASSET" ]; then
            curl -fsSL --max-time 15 "https://percymain.org${ASSET}" -o /dev/null
          else
            echo "::warning::No JS chunk found in index.html — skipping asset reachability check"
          fi

      - name: Deploy summary
        if: always()
        env:
          REF_INPUT: ${{ inputs.ref }}
          DEPLOYED_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          {
            echo "## Deploy Web (manual) — ${{ job.status }}"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Ref input: \`${REF_INPUT}\`"
            echo "- SHA: \`${DEPLOYED_SHA:-${GITHUB_SHA}}\`"
            echo "- Bucket: \`${{ vars.FRONTEND_BUCKET }}\`"
            echo "- CF distribution: \`${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}\`"
            echo "- Invalidation: \`${{ steps.invalidate.outputs.invalidation_id || 'skipped' }}\`"
            echo "- Smoke: \`${{ steps.smoke-web.outcome || 'skipped' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-deploy-failure
        with:
          job: deploy-web-manual
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
