name: Lint, Test, Build

# Reusable CI job — invoked from ci.yml (PR gate) and deploy.yml (main
# deploy gate). Runs the same lint/typecheck/test/build set in both
# places so a build break that only manifests with prod env vars or a
# missing workspace export fails fast before any deploy work begins.
#
# Permissions design: the test job below intentionally only requests
# `contents: read` and uses `persist-credentials: false` on checkout,
# because it executes branch code (lint/test/build of arbitrary PR
# diffs). The JUnit XML is uploaded as an artifact and consumed by a
# separate `publish-test-results` job that runs no PR code but does
# have the elevated checks/PR-comment perms. This split prevents a
# malicious PR from reading the GITHUB_TOKEN that would let it write
# checks or comments back to the repo.

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: "bash -euo pipefail {0}"

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        # pgvector/pgvector:pg16 = official Postgres 16 image with the
        # vector extension pre-built. Drop-in for postgres:16-alpine —
        # required since the scout_fact migration runs CREATE EXTENSION
        # vector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: percy
          POSTGRES_PASSWORD: percy
          POSTGRES_DB: percy_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U percy -d percy_main"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the GITHUB_TOKEN in .git/config where executed
          # PR code (tests, lint plugins, build scripts) could read it
          # and use it for unintended writes back to the repo.
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:up
        env:
          DATABASE_URL: postgres://percy:percy@localhost:5432/percy_main

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgres://percy:percy@localhost:5432/percy_main
          CI: "true"

      - name: Integration tests
        run: pnpm --filter api test:integration
        env:
          CI: "true"

      - name: Build
        run: pnpm build

      - name: Upload JUnit XML artefact
        # Always upload — even when a test step failed — so the publish
        # job below can post the failure summary to the PR.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: "**/test-results/*.xml"
          if-no-files-found: ignore
          retention-days: 7

  publish-test-results:
    # Runs in a separate job with the elevated checks/PR-comment perms
    # so the executing-PR-code job above doesn't get a token capable
    # of writing back to the repo. This job pulls the JUnit XML from
    # the artefact and publishes — no checkout, no PR code execution.
    needs: lint-test-build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download JUnit XML artefact
        uses: actions/download-artifact@v4
        with:
          name: junit-xml
          path: junit-xml
        continue-on-error: true

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          junit_files: "junit-xml/**/*.xml"
          check_name: "Vitest results"
          comment_mode: changes in failures
          action_fail: false
