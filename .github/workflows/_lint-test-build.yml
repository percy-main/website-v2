name: Lint, Test, Build

# Reusable CI gate — invoked from ci.yml (PR gate) and deploy.yml
# (main deploy gate). Splits the gate into independent fan-out jobs
# so format-check / lint / typecheck / build / unit-tests run in
# parallel, dropping wall-clock from ~1m38s sequential to roughly
# install (~13s) + max(per-job, ~15s) once Turborepo's cache warms.
#
# Permissions design: each executing job only requests `contents:
# read` and pins `persist-credentials: false` on checkout, because
# they run branch code (lint plugins, test files, build scripts) on
# arbitrary PR diffs. JUnit XML is uploaded as artefacts and read by
# a single `publish-test-results` job downstream that has the
# elevated checks/PR-comment perms but runs no PR code.
#
# Caching: per-task Turborepo cache lives in `.turbo/` and is keyed
# on the task name plus the commit SHA, with a task-prefixed
# restore-keys fallback so the next run hits the latest cache from
# the same task. pnpm's content-addressed store is cached by
# `actions/setup-node`'s `cache: pnpm`. node_modules is not cached
# directly — pnpm's symlink tree doesn't round-trip cleanly through
# tar.

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: "bash -euo pipefail {0}"

jobs:
  format-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-lint-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-lint-
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-typecheck-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-typecheck-
      - run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-
      - name: Unit tests
        run: pnpm test
        env:
          CI: "true"
      - name: Upload JUnit XML artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-unit
          path: "**/test-results/*.xml"
          if-no-files-found: ignore
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        # pgvector/pgvector:pg16 = official Postgres 16 image with the
        # vector extension pre-built. Drop-in for postgres:16-alpine —
        # required since the scout_fact migration runs CREATE EXTENSION
        # vector. Used here for the `db:up` smoke test only; the API
        # integration tests spin up their own per-file Postgres via
        # testcontainers (see apps/api/src/test/containers.ts).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: percy
          POSTGRES_PASSWORD: percy
          POSTGRES_DB: percy_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U percy -d percy_main"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-test-integration-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-integration-
      - name: Run migrations (smoke)
        run: pnpm db:up
        env:
          DATABASE_URL: postgres://percy:percy@localhost:5432/percy_main
      - name: Integration tests
        run: pnpm test:integration
        env:
          CI: "true"
      - name: Upload JUnit XML artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-integration
          path: "**/test-results/*.xml"
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-
      - run: pnpm build

  openapi-drift:
    # Guardrail (#343): the OpenAPI spec and the typed client under
    # apps/{web,matchday}/src/lib/api.gen.* are generated artefacts -
    # CLAUDE.md requires running `pnpm openapi:generate` after touching
    # any route response schema. This job regenerates them and fails if
    # the committed copies don't match, so a contributor who forgets to
    # run the script can't merge a PR whose API types lie about the
    # backend contract.
    #
    # The regen is driven by Turborepo (`api#openapi` task) with
    # $TURBO_ROOT$ outputs pointing at the four committed files, so on
    # a cache hit turbo restores them in milliseconds instead of
    # re-booting Fastify + running openapi-typescript twice.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-openapi-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-openapi-
      - name: Regenerate OpenAPI spec + typed clients
        run: pnpm openapi:generate
      - name: Verify generated files match committed copies
        run: |
          if ! git diff --exit-code -- \
            apps/web/src/lib/api.gen.json \
            apps/web/src/lib/api.gen.d.ts \
            apps/matchday/src/lib/api.gen.json \
            apps/matchday/src/lib/api.gen.d.ts; then
            echo ""
            echo "::error::OpenAPI generated files are out of date. Run 'pnpm openapi:generate' locally and commit the result."
            exit 1
          fi

  publish-test-results:
    # Separate job with the elevated checks/PR-comment perms so the
    # executing-PR-code jobs above don't get a token capable of
    # writing back to the repo. Reads the JUnit XML from artefacts —
    # no checkout, no PR code execution.
    needs: [unit-tests, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download unit JUnit XML
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-unit
          path: junit-xml/unit
        continue-on-error: true

      - name: Download integration JUnit XML
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-integration
          path: junit-xml/integration
        continue-on-error: true

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: "junit-xml/**/*.xml"
          check_name: "Vitest results"
          comment_mode: changes in failures
          action_fail: false
