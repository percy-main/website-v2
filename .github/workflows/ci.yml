name: CI

on:
  pull_request:
    branches: [main]

# Default minimal permissions for all jobs; jobs that need more
# (e.g. react-doctor's pull-requests: write) opt in explicitly below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: "bash -euo pipefail {0}"

jobs:
  lint-test-build:
    permissions:
      contents: read
      # Required by publish-unit-test-result-action inside the reusable
      # workflow — reusable workflows can't request perms the caller
      # doesn't grant.
      checks: write
      pull-requests: write
    uses: ./.github/workflows/_lint-test-build.yml

  unsafe-ddl-check:
    # Guardrail against unsafe DDL in migrations (DROP COLUMN / DROP
    # TABLE / SET NOT NULL on existing data) — but only inside the body
    # of `up()`. A naive whole-file grep flagged every migration that
    # added a column, because the corresponding `down()` drops it (#305).
    # The new check parses each changed migration with the TypeScript
    # compiler and limits the pattern scan to text spans inside `up()`.
    # Opt-out via a `safe-ddl-ack: <reason>` token in any commit message.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # setup-deps installs the workspace and gives the script access to
      # the root `typescript` devDep used by the AST walker.
      - uses: ./.github/actions/setup-deps
      - run: node .github/scripts/check-unsafe-ddl.mjs "origin/${{ github.base_ref }}"

  react-doctor:
    # Diff-only scan of apps/web on the PR. Any finding (warning or
    # error) blocks merge — matches the project-wide no-warnings policy
    # already enforced in eslint.config.mjs via `warnsToErrors()`.
    # Scoped to apps/web because react-doctor's rules target React
    # client code; server-side files in apps/api would otherwise trip
    # false positives like `prefer-dynamic-import` on Node-only libs.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: millionco/react-doctor@main
        with:
          diff: main
          directory: apps/web
          fail-on: warning
          github-token: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    # Build the API container the same way deploy.yml does and run Trivy
    # against it. Keeps CVEs in transitive deps + the base image visible at
    # PR time, instead of surfacing only when the deploy gate runs on main.
    # No push — image stays local to the runner.
    #
    # Buildx + GHA registry-side cache: turborepo's docker-equivalent.
    # Without it every PR rebuilds the full image (pnpm install, packages
    # build) cold. With `cache-from: type=gha` BuildKit pulls layers
    # whose RUN/COPY inputs match the prior cache; `cache-to: mode=max`
    # exports all intermediate layers, not just the final one, so the
    # build stage's `pnpm install` survives across PRs. See #339.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      IMAGE: percy-main-api:pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=image-scan
          cache-to: type=gha,mode=max,scope=image-scan

      - name: Trivy scan
        # Mirrors the deploy.yml gate. SHA-pinned for the reasons documented
        # there. Suppressions live in `.trivyignore` at the repo root.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table

  dependency-review:
    # Scans dependency manifest changes (pnpm-lock.yaml diffs, etc) for
    # known vulnerable advisories. Fails the PR on `high`+ severity.
    # CodeQL handles SAST separately (configured via repo default
    # setup, not in workflow files).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Block GPL/AGPL/etc copyleft licences in production deps —
          # we ship code under a permissive setup. Add allow-list entries
          # if a needed dep is mis-classified.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: on-failure
