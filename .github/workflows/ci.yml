name: CI

on:
  pull_request:
    branches: [main]

# Default minimal permissions for all jobs; jobs that need more
# (e.g. react-doctor's pull-requests: write) opt in explicitly below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: "bash -euo pipefail {0}"

jobs:
  lint-test-build:
    permissions:
      contents: read
      # Required by publish-unit-test-result-action inside the reusable
      # workflow — reusable workflows can't request perms the caller
      # doesn't grant.
      checks: write
      pull-requests: write
    uses: ./.github/workflows/_lint-test-build.yml

  unsafe-ddl-check:
    # Guardrail against unsafe DDL in migrations (DROP COLUMN / DROP
    # TABLE / SET NOT NULL on existing data) — but only inside the body
    # of `up()`. A naive whole-file grep flagged every migration that
    # added a column, because the corresponding `down()` drops it (#305).
    # The new check parses each changed migration with the TypeScript
    # compiler and limits the pattern scan to text spans inside `up()`.
    # Opt-out via a `safe-ddl-ack: <reason>` token in any commit message.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # setup-deps installs the workspace and gives the script access to
      # the root `typescript` devDep used by the AST walker.
      - uses: ./.github/actions/setup-deps
      - run: node .github/scripts/check-unsafe-ddl.mjs "origin/${{ github.base_ref }}"

  actionlint:
    # Lints every workflow file (#700): misspelled or unknown keys, bad
    # `needs` / `if` expressions, contexts that cannot resolve where they
    # are used, missing inputs on the local composite actions under
    # .github/actions/, and shellcheck over every `run:` block. PR-only:
    # a workflow that does not lint should never reach main, and there is
    # nothing here worth re-running on the deploy path.
    #
    # Runs the official image published from the actionlint repo, pinned
    # by digest. A tag is mutable, a digest is not - the same reasoning
    # behind the SHA pin on every `uses:` in this repo - and the image
    # bundles the shellcheck build actionlint expects, so a local
    # `docker run` of this digest reproduces CI exactly rather than
    # grading against whatever shellcheck happens to be installed.
    #
    # Dependabot does NOT track this pin: its github-actions ecosystem
    # reads `uses:` refs, not image references inside a `run:` step. To
    # bump, pick a release from github.com/rhysd/actionlint/releases,
    # run `docker pull rhysd/actionlint:<version>`, and update the tag
    # and the digest below together.
    #
    # Findings are fixed in the workflow files themselves. The only
    # suppressions are inline `# shellcheck disable=<code>` directives
    # carrying a reason, which is why there is no .github/actionlint.yaml
    # blanket-disabling rules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflow files
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            "$ACTIONLINT_IMAGE" \
            -color

  tf-unlock-scope-check:
    # Guardrail for the Terraform state-lock invariant (#631): no
    # automatic unlock may release a lock it did not create. The
    # invariant, and the concurrency-group overlap that makes it matter,
    # are defined and explained on the `only-current-runner` input in
    # .github/actions/tf-unlock/action.yml - this job only enforces it.
    #
    # It is a script rather than an actionlint rule because actionlint
    # has no custom-rule mechanism: it can require that a local action's
    # input is *present*, but not that it holds a particular value. The
    # script header spells that out in full.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-deps installs the workspace, which is where the script gets
      # the root `yaml` devDep it parses the workflow files with.
      - uses: ./.github/actions/setup-deps
      - run: node .github/scripts/check-tf-unlock-scope.mjs

  react-doctor:
    # Diff-only scan of apps/web on the PR. Any PR-introduced finding
    # (warning or error) blocks merge — matches the project-wide
    # no-warnings policy already enforced in eslint.config.mjs via
    # `warnsToErrors()`.
    # Scoped to apps/web because react-doctor's rules target React
    # client code; server-side files in apps/api would otherwise trip
    # false positives like `prefer-dynamic-import` on Node-only libs.
    runs-on: ubuntu-latest
    permissions:
      # Sticky summary comment + inline review comments.
      pull-requests: write
      # Commit status with the score (the action warns and skips it
      # without this).
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Action and CLI versions travel together: the CLI's report format
      # is decoded by the action, so an action pinned between releases
      # breaks when `react-doctor@latest` moves (a May recovery-point pin
      # + CLI 0.7.6's v3 report format = "exited before producing a JSON
      # report", #634). Keep the pin on a tagged release so dependabot
      # bumps it alongside the ecosystem.
      - uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2.2.9
        with:
          directory: apps/web
          blocking: warning

  changes:
    # Path filter for image-scan. Lives in its own job so image-scan can
    # be skipped at the job level: a job skipped via `if:` reports
    # conclusion "skipped", which branch protection counts as passing for
    # the required `image-scan` check. (A workflow-level `paths:` filter
    # would leave the check stuck at "Expected" and block merge instead.)
    runs-on: ubuntu-latest
    permissions:
      # paths-filter lists PR files via the API on pull_request events,
      # so no checkout is needed - but it does need PR read access.
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Everything that can change what Trivy finds in the API
            # image: the base image / build steps (Dockerfile), the
            # installed dep tree (pnpm-lock.yaml is the source of truth
            # under --frozen-lockfile; overrides live in
            # pnpm-workspace.yaml; root package.json for packageManager /
            # engines), the suppression list, and this workflow itself.
            image:
              - "apps/api/Dockerfile"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "package.json"
              - ".trivyignore"
              - ".github/workflows/ci.yml"

  image-scan:
    # Build the API container the same way deploy.yml does and run Trivy
    # against it - but only when the PR touches something that can change
    # the scan result (see the `changes` filter above). Feature PRs no
    # longer go red for CVEs published against deps they didn't touch;
    # newly-introduced vulnerable deps are still caught here (lockfile
    # PRs) and by dependency-review below, and the deploy.yml gate on
    # main remains the unconditional backstop before anything ships.
    # No push — image stays local to the runner.
    #
    # Buildx + GHA registry-side cache: turborepo's docker-equivalent.
    # Without it every PR rebuilds the full image (pnpm install, packages
    # build) cold. With `cache-from: type=gha` BuildKit pulls layers
    # whose RUN/COPY inputs match the prior cache; `cache-to: mode=max`
    # exports all intermediate layers, not just the final one, so the
    # build stage's `pnpm install` survives across PRs. See #339.
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      IMAGE: percy-main-api:pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build API image (local, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=image-scan
          cache-to: type=gha,mode=max,scope=image-scan

      - name: Trivy scan
        # Mirrors the deploy.yml gate. SHA-pinned for the reasons documented
        # there. Suppressions live in `.trivyignore` at the repo root.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table

  dependency-review:
    # Scans dependency manifest changes (pnpm-lock.yaml diffs, etc) for
    # known vulnerable advisories. Fails the PR on `high`+ severity.
    # CodeQL handles SAST separately (configured via repo default
    # setup, not in workflow files).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Block GPL/AGPL/etc copyleft licences in production deps —
          # we ship code under a permissive setup. Add allow-list entries
          # if a needed dep is mis-classified.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: on-failure
